# Локальные порты для преподавательского примера, не конфликтующие с базой КР №1.
# В скачанном compose порт контейнера PostgreSQL указан 5433, хотя сервер слушает 5432.
services:
  db:
    ports: !override
      - "127.0.0.1:55432:5432"
  backend:
    ports: !override
      - "127.0.0.1:18080:8080"
